spring:
  application:
    name: rates-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/rates}
    username: ${SPRING_DATASOURCE_USERNAME:rates}
    password: ${SPRING_DATASOURCE_PASSWORD:rates}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    #show-sql: true
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
      jdbc:
        batch_size: 50
      order_inserts: true
      order_updates: true

server:
  port: ${SERVER_PORT:8080}

cbr:
  base-url: "https://cbr.ru"
  scheduler:
    cron: 0 0 10-21/1 * * MON-SAT
    zone: Europe/Moscow

logging:
  level:
    root: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    ru.eremin.springbootprometheusgrafana.apiclient.CbrFeignClient: DEBUG
    feign: DEBUG
    org.apache.http: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: 'prometheus, health'
  prometheus:
    metrics:
      export:
        enabled: true
  metrics:
    distribution:
      percentiles-histogram:
        "[http.server.requests]": true
